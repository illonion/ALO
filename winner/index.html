<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winner</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="../_shared/utils.js"></script>
</head>
<body>
    <video loop muted autoplay>
        <source src="../_shared/assets/background.mp4">
    </video>
    <div class="main">
        <!-- Winner -->
        <img class="winner-image" src="static/winner.png">
        <img class="crown-image crown-image-left" id="crown-image" src="static/crown.png">

        <!-- Team Name -->
        <div class="team-name team-name-left" id="team-name-left">TEAM AHH</div>
        <div class="team-name team-name-right" id="team-name-right">TEAM BHH</div>

        <!-- Team Sections -->
        <div class="player-section player-section-left" id="player-section-left">
            <div class="player-container player-container-left">
                <div class="profile-picture"></div>
                <div class="player-details">
                    <div class="player-name">PLAYER 1</div>
                    <div class="player-rank">#2,340</div>
                </div>
            </div>
            <div class="player-container player-container-left">
                <div class="profile-picture"></div>
                <div class="player-details">
                    <div class="player-name">PLAYER 1</div>
                    <div class="player-rank">#2,340</div>
                </div>
            </div>
        </div>
        <div class="player-section player-section-right" id="player-section-right">
            <div class="player-container player-container-right">
                <div class="profile-picture"></div>
                <div class="player-details">
                    <div class="player-name">PLAYER 1</div>
                    <div class="player-rank">#2,340</div>
                </div>
            </div>
            <div class="player-container player-container-right">
                <div class="profile-picture"></div>
                <div class="player-details">
                    <div class="player-name">PLAYER 1</div>
                    <div class="player-rank">#2,340</div>
                </div>
            </div>
        </div>

        <!-- Score -->
        <div class="scoreline" id="scoreline">7 - 6</div>
    </div>

    <script src="index.js"></script>
</body>
</html>
